name: Publish

# Tag js-vX.Y.Z publishes "@alion-io/sdk" and mcp-vX.Y.Z publishes "@alion-io/mcp" to npm;
# tag py-vX.Y.Z publishes "alion" and lc-vX.Y.Z publishes "langchain-alion" to PyPI.
# Trusted publishing: npm and PyPI check this workflow's OIDC identity, no token is stored anywhere.

on:
  push:
    tags:
      - 'js-v*'
      - 'mcp-v*'
      - 'py-v*'
      - 'lc-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ startsWith(github.ref_name, 'js-v') || startsWith(github.ref_name, 'mcp-v') }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      # (no registry-url: setup-node would write a placeholder NODE_AUTH_TOKEN into .npmrc, and npm sent it instead of the
      # OIDC exchange - E404 on the first CI release, js-v0.2.0, 2026-11-23)
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Trusted publishing needs npm 11.5.1 or newer
        run: npm install -g npm@^11.5.1
      - name: Pick the package from the tag
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            js-v*)  echo "dir=js"  >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#js-v}"  >> "$GITHUB_OUTPUT" ;;
            mcp-v*) echo "dir=mcp" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#mcp-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
      - name: Tag equals package.json version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          v=$(node -p "require('./package.json').version")
          test "$v" = "${{ steps.pkg.outputs.version }}" || { echo "package.json has $v, tag says ${{ steps.pkg.outputs.version }}"; exit 1; }
      - run: npm ci
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: npm run build --if-present
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: npm test
        working-directory: ${{ steps.pkg.outputs.dir }}
      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}

  pypi:
    if: ${{ startsWith(github.ref_name, 'py-v') }}
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tag equals the package version
        run: |
          v=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/alion/_version.py').read()).group(1))")
          test "$v" = "${GITHUB_REF_NAME#py-v}" || { echo "_version.py has $v, tag says ${GITHUB_REF_NAME#py-v}"; exit 1; }
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  langchain:
    if: ${{ startsWith(github.ref_name, 'lc-v') }}
    runs-on: ubuntu-latest
    # (its own environment: PyPI matches a token to one trusted publisher, and the alion project already uses pypi)
    environment: pypi-langchain
    defaults:
      run:
        working-directory: langchain
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tag equals the package version
        run: |
          v=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/langchain_alion/_version.py').read()).group(1))")
          test "$v" = "${GITHUB_REF_NAME#lc-v}" || { echo "_version.py has $v, tag says ${GITHUB_REF_NAME#lc-v}"; exit 1; }
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ../python -e '.[dev]'
      - run: python -m pytest
      - run: python -m pytest tests/integration_tests
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: langchain/dist

  release:
    # a GitHub release for the tag, its notes taken from the package's CHANGELOG.md section of that version; runs once the
    # publishing job of the tag has passed (the other jobs are skipped, which needs does not count as a failure)
    needs: [publish, pypi, langchain]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            js-v*)  dir=js;        name='@alion-io/sdk' ;;
            mcp-v*) dir=mcp;       name='@alion-io/mcp' ;;
            py-v*)  dir=python;    name='alion (PyPI)' ;;
            lc-v*)  dir=langchain; name='langchain-alion (PyPI)' ;;
          esac
          v="${GITHUB_REF_NAME#*-v}"
          awk -v v="$v" '/^## /{p = (index($0, "## " v " ") == 1 || $0 == "## " v); next} p' "$dir/CHANGELOG.md" > notes.md
          test -s notes.md || echo "See $dir/CHANGELOG.md." > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$name $v" --notes-file notes.md --verify-tag
